server:
  port: ${PORT:8084}

spring:
  application:
    name: feed-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:feed_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgrespassword}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

social:
  service:
    url: ${SOCIAL_SERVICE_URL:http://localhost:8082}

post-service:
  url: ${POST_SERVICE_URL:http://localhost:8083}

post:
  service:
    url: ${POST_SERVICE_URL:http://localhost:8083}
