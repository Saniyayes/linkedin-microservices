databases:
  - name: nodework-postgres
    databaseName: nodework
    user: nodework
    plan: free

services:
  # React Frontend (Static Site - Free & Fast)
  - type: web
    name: nodework-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nodework-api-gateway
          envVarKey: RENDER_EXTERNAL_URL

  # API Gateway (Public Reverse Proxy & Router)
  - type: web
    name: nodework-api-gateway
    runtime: docker
    rootDir: api-gateway
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: nodework-user-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: SOCIAL_SERVICE_URL
        fromService:
          type: web
          name: nodework-social-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: POST_SERVICE_URL
        fromService:
          type: web
          name: nodework-post-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: FEED_SERVICE_URL
        fromService:
          type: web
          name: nodework-feed-service
          envVarKey: RENDER_EXTERNAL_URL

  # User Service
  - type: web
    name: nodework-user-service
    runtime: docker
    rootDir: user-service
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: nodework-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nodework-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nodework-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: nodework-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nodework-postgres
          property: password

  # Social Graph Service
  - type: web
    name: nodework-social-service
    runtime: docker
    rootDir: social-service
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: nodework-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nodework-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nodework-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: nodework-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nodework-postgres
          property: password
      - key: FEED_SERVICE_URL
        fromService:
          type: web
          name: nodework-feed-service
          envVarKey: RENDER_EXTERNAL_URL

  # Post & Job Service
  - type: web
    name: nodework-post-service
    runtime: docker
    rootDir: post-service
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: nodework-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nodework-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nodework-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: nodework-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nodework-postgres
          property: password
      - key: FEED_SERVICE_URL
        fromService:
          type: web
          name: nodework-feed-service
          envVarKey: RENDER_EXTERNAL_URL

  # Feed, Messaging & Notification Service
  - type: web
    name: nodework-feed-service
    runtime: docker
    rootDir: feed-service
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: nodework-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nodework-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nodework-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: nodework-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nodework-postgres
          property: password
      - key: SOCIAL_SERVICE_URL
        fromService:
          type: web
          name: nodework-social-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: POST_SERVICE_URL
        fromService:
          type: web
          name: nodework-post-service
          envVarKey: RENDER_EXTERNAL_URL
