name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  # Runs on every push and PR - build + test all 5 services, no AWS calls.
  # This is what actually protects main; deploy only runs after this passes.
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, post-service, social-service, feed-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B verify

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  # Only runs on push to main, and only after build-and-test passes.
  # Builds Docker images, pushes to ECR, and triggers an EB deploy per service.
  deploy:
    needs: [build-and-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: user-service
            port: 8081
          - service: post-service
            port: 8083
          - service: social-service
            port: 8082
          - service: feed-service
            port: 8084
          - service: api-gateway
            port: 8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        working-directory: ${{ matrix.service }}
        run: mvn -B package -DskipTests

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push Docker image
        working-directory: ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: linkedin-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Write Dockerrun.aws.json
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: linkedin-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '{"AWSEBDockerrunVersion":"1","Image":{"Name":"%s/%s:%s","Update":"true"},"Ports":[{"ContainerPort":"%s"}]}' \
            "$ECR_REGISTRY" "$ECR_REPOSITORY" "$IMAGE_TAG" "${{ matrix.port }}" > Dockerrun.aws.json
          mkdir -p .ebextensions
          zip -r deploy.zip Dockerrun.aws.json .ebextensions

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: linkedin-${{ matrix.service }}
          environment_name: linkedin-${{ matrix.service }}-prod
          version_label: ${{ github.sha }}
          region: ${{ env.AWS_REGION }}
          deployment_package: deploy.zip
