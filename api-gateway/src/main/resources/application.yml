server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**, /api/auth/**

        - id: social-service
          uri: ${SOCIAL_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/connections/**, /api/graph/**

        - id: post-service
          uri: ${POST_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/posts/**, /api/likes/**, /api/comments/**

        - id: feed-service
          uri: ${FEED_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/feed/**

        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/chat/**, /ws/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
