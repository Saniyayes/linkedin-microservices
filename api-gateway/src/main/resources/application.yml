server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**, /api/auth/**

        - id: social-service
          uri: ${SOCIAL_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/connections/**, /api/graph/**

        - id: post-service
          uri: ${POST_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/posts/**, /api/likes/**, /api/comments/**, /api/jobs/**

        - id: feed-service
          uri: ${FEED_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/feed/**, /api/chat/**, /ws/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "https://*.onrender.com"
              - "${FRONTEND_URL:https://nodework-frontend.onrender.com}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
